[project]
name = "claude4aieng"
version = "0.1.0"
description = "Taller 'Tool use sin abstracciones' — Claude Community CDMX, 19 oct 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
